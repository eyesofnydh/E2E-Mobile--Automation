# =====================================================================
# Scoot Mobile Automation - central configuration
# No credentials or locators belong in code; everything tunable is here.
# =====================================================================

# ---- Which app to test: user | driver -------------------------------
# Override at runtime with:  mvn test -DtargetApp=driver
targetApp=user

# ---- Appium server ---------------------------------------------------
appium.server.url=http://127.0.0.1:4723

# ---- Device (real device currently connected via USB) ----------------
platformName=Android
automationName=UiAutomator2
deviceName=R38M30A6PRT
platformVersion=12

# ---- User app --------------------------------------------------------
user.appPackage=com.scoottnc.user
user.appActivity=com.trioangle.goferhandy.common.SplashActivity

# ---- Driver app ------------------------------------------------------
driver.appPackage=com.scoottncdriver.driver
driver.appActivity=com.trioangle.goferhandyprovider.common.ui.SplashActivity

# ---- Optional: APK paths (leave blank since apps are already installed)
# If set, Appium will (re)install the app. Keep blank to launch the
# already-installed build and avoid wiping app state.
user.app=
driver.app=

# ---- Timeouts (seconds) ----------------------------------------------
# Appium tip: keep implicit wait at 0 and rely on explicit waits only,
# exactly like good Selenium practice. Mixing the two causes flaky waits.
timeout.implicit=0
timeout.explicit=20
timeout.pageLoad=30
# How long to wait for the Appium "new session" (app install + launch)
timeout.newCommand=120

# ---- Session behavior ------------------------------------------------
# noReset=true  -> keep app data/signed-in state between sessions (fast, safe)
# fullReset=false -> do NOT uninstall the app
noReset=true
fullReset=false
autoGrantPermissions=true
# forceAppLaunch=true -> cold-start the app on every session even when noReset=true.
# Without this, Appium resumes whatever screen the app was last on, so tests that
# expect the first screen (sign-in home) become non-deterministic.
forceAppLaunch=true
# shouldTerminateApp=true -> stop the app when the session ends, leaving a clean slate.
shouldTerminateApp=true

# ---- Test environment / accounts -------------------------------------
# Staging test account. Credentials are intentionally BLANK here so no secrets
# live in this (committable) file. Put the real staging phone/password in
# src/main/resources/config.local.properties (gitignored) — ConfigReader
# overlays it on top of this file. You can also pass them at runtime, e.g.
#   mvn test "-Duser.testPhone=..." "-Duser.testPassword=..."
# NOTE: do not name a key `user.country` / `user.language` / `user.home` etc. —
# those are reserved JVM system properties and would shadow the file value.
env=staging
user.countryName=India
user.countryCode=+91
user.testPhone=
user.testPassword=
driver.countryName=India
driver.countryCode=+91
driver.testPhone=
driver.testPassword=
